<svg viewBox="0 0 680 650" width="100%" role="img" aria-labelledby="arch-title arch-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="arch-title">Alice 目标总体架构</title>
  <desc id="arch-desc">渲染层包含聊天、伴侣、课堂和设置，主进程包含对话、伴侣和教师三个运行时，共享事件、模型、记忆学情与行动代理，底层连接本地数据、语音服务和操作系统。</desc>
